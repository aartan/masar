appId: com.masar.app
productName: Masar
copyright: Copyright © 2026 Masar

directories:
  output: dist-desktop
  buildResources: desktop/build

# The asar contains only the Electron main process and preload bundle. The
# local API, renderer, migrations and native libSQL binaries are copied into
# Resources by desktop/scripts/after-pack.js.
files:
  - desktop/dist/main.js
  - desktop/dist/preload.js
  - desktop/dist/api-config.json
  - package.json
  - "!node_modules/**/*"

asar: true

# Prevent electron-builder from rebuilding native modules.
npmRebuild: false

afterPack: desktop/scripts/after-pack.js

# macOS
mac:
  category: public.app-category.productivity
  icon: desktop/build/icon.png
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: desktop/build/entitlements.mac.plist
  entitlementsInherit: desktop/build/entitlements.mac.plist
  identity: null

# Windows
win:
  icon: desktop/build/icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# Linux (Fedora, GNOME, Ubuntu and other distributions)
linux:
  icon: desktop/build/icon.svg
  category: Office
  target:
    - target: rpm
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: AppImage
      arch:
        - x64
        - arm64

# Fedora RPM
rpm:
  artifactName: ${productName}-${version}-${arch}.${ext}

# Portable Linux application
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

# macOS notarization
afterSign: desktop/scripts/notarize.js

# Artifact naming
artifactName: ${productName}-${version}-${arch}.${ext}
