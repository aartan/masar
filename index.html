<!doctype html>
<html lang="en" data-scroll-behavior="smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6f1" />
    <meta
      name="description"
      content="A local-first Kanban workspace for planning work and moving it from backlog to completion."
    />
    <title>Masar — Kanban project management</title>
    <script>
      // Load Excalidraw's fonts from the bundled, self-hosted copy instead of
      // its default CDN so whiteboards work offline in packaged Electron. Must
      // be set before the Excalidraw module loads. The trailing slash matters.
      window.EXCALIDRAW_ASSET_PATH = "/excalidraw-assets/";
    </script>
    <script>
      (function () {
        try {
          var bridgeTheme =
            window.masarDesktop && window.masarDesktop.initialTheme;
          var stored =
            bridgeTheme || localStorage.getItem("masar:theme") || "system";
          var dark =
            stored === "dark" ||
            (stored === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark
            ? "dark"
            : "light";
        } catch (error) {
          /* localStorage can be unavailable in hardened contexts. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
